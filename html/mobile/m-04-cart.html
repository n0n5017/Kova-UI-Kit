<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kova - Cart</title>
    <link rel="stylesheet" href="../../css/mobile/m-main.css" />
  </head>
  <body>
    <header class="mobile-header">
      <div class="header-top">
        <a href="01-home.html" class="back-arrow">←</a>
        <h1 class="header-title">Your Cart</h1>
        <div class="header-actions"></div>
      </div>
    </header>

    <main class="mobile-main cart-main">
      <div id="cart-items-container" class="cart-items-list">
        <!-- Cart items loaded dynamically -->
        <div class="loading-state">Loading cart...</div>
      </div>

      <div
        class="cart-summary-card"
        id="cart-summary-section"
        style="display: none"
      >
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>Free</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="cart-total">$0.00</span>
        </div>
      </div>
    </main>

    <div
      class="mobile-sticky-footer"
      id="cart-sticky-footer"
      style="display: none"
    >
      <button class="primary-btn checkout-action" id="checkout-btn">
        Proceed to Checkout
      </button>
    </div>

    <nav class="mobile-bottom-nav">
      <a href="01-home.html" class="nav-item">
        <svg
          width="20"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Shop</span>
      </a>
      <a href="02-product-listing.html" class="nav-item">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <span>Search</span>
      </a>
      <a href="04-cart.html" class="nav-item active">
        <svg
          width="20"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          />
        </svg>
        <span>Cart</span>
      </a>
      <a href="05-login.html" class="nav-item">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>Account</span>
      </a>
    </nav>

    <script src="../../js/mobile/m-cart.js"></script>
  </body>
</html>
