<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOVA - Products</title>
    <link rel="stylesheet" href="../../css/mobile/m-main.css" />
  </head>
  <body>
    <header class="mobile-header">
      <div class="header-top">
        <button class="icon-btn back-btn">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="logo">KOVA</div>
        <div class="header-actions">
          <button class="icon-btn cart-btn">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
            <span class="cart-badge">3</span>
          </button>
        </div>
      </div>
    </header>

    <main class="mobile-main">
      <div class="listing-header">
        <h1>All products</h1>
        <span class="product-count-label">194 products</span>
      </div>

      <div class="filter-bar">
        <button class="filter-pill active">All</button>
        <button class="filter-pill">Beauty</button>
        <button class="filter-pill">Fragrances</button>
        <button class="filter-pill">Furniture</button>
        <button class="filter-pill">Groceries</button>
      </div>

      <div class="mobile-product-grid" id="product-grid"></div>
    </main>

    <nav class="mobile-bottom-nav">
      <a href="m-01-home.html" class="nav-item active">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Shop</span>
      </a>
      <a href="#" class="nav-item">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search</span>
      </a>
      <a href="#" class="nav-item">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          ></path>
        </svg>
        <span>Cart</span>
      </a>
      <a href="#" class="nav-item">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Account</span>
      </a>
    </nav>

    <script src="../../js/mobile/m-product-listing.js"></script>
  </body>
</html>
