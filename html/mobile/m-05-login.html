<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kova - Sign In</title>
    <link rel="stylesheet" href="../../css/mobile/m-main.css" />
  </head>
  <body>
    <header class="mobile-header">
      <div class="header-top">
        <a href="01-home.html" class="back-arrow">←</a>
        <div class="brand-logo">KOVA</div>
        <div class="header-actions"></div>
      </div>
    </header>

    <main class="mobile-main auth-main">
      <div class="auth-header-block">
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-subtitle">Use any account from the users list.</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            value="emilys"
            required
          />
        </div>

        <div class="input-group error">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              value="wrongpass"
              required
            />
            <button
              type="button"
              class="password-toggle-btn"
              id="toggle-password"
            >
              👁️
            </button>
          </div>
          <span class="error-message" id="error-msg"
            >A Username or password is incorrect.</span
          >
        </div>

        <button type="submit" class="primary-btn auth-submit-btn">
          Sign in
        </button>
      </form>

      <div class="test-credentials-box">
        <span>Test credentials: <strong>emilys / emilyspass</strong></span>
      </div>

      <div class="auth-footer-link">
        <span>New here? <a href="#">Create an account</a></span>
      </div>
    </main>

    <script src="../../js/mobile/m-login.js"></script>
  </body>
</html>
