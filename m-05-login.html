<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOVA - Sign In</title>
  <link rel="stylesheet" href="../css/mobile/m-main.css">
</head>
<body class="mobile-body">
  <div class="mobile-screen-wrapper" style="justify-content: center; padding: 24px;">
    <div style="margin-bottom: 24px;">
      <span style="font-weight: 900; font-size: 18px; letter-spacing: -0.5px; background: #eab308; padding: 4px 8px; border-radius: 4px; color: #111827;">KOVA</span>
    </div>

    <h1 style="font-size: 24px; font-weight: bold; color: #111827; margin: 0 0 6px 0;">Sign in</h1>
    <p style="font-size: 13px; color: #6b7280; margin: 0 0 24px 0;">Use any account from the users list.</p>

    <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px;">
      <div>
        <label style="display: block; font-size: 12px; font-weight: 500; color: #111827; margin-bottom: 6px;">Username</label>
        <input type="text" value="emilys" style="width: 1px; min-width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; background: #fff;">
      </div>

      <div>
        <label style="display: block; font-size: 12px; font-weight: 500; color: #111827; margin-bottom: 6px;">Password</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input type="password" value="wrongpass" style="width: 1px; min-width: 100%; padding: 10px 36px 10px 12px; border: 1px solid #dc2626; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; background: #fff;">
          <span style="position: absolute; right: 12px; font-size: 14px; color: #6b7280; cursor: pointer;">👁</span>
        </div>
        <div style="font-size: 11px; color: #dc2626; margin-top: 6px; display: flex; align-items: center; gap: 4px;">
          <span>⚠️</span> Username or password is incorrect.
        </div>
      </div>
    </div>

    <button class="btn-primary-action" style="background: #facc15; color: #111827; font-weight: bold; margin-bottom: 16px; border: none; border-radius: 6px; padding: 12px; width: 100%; cursor: pointer;">Sign in</button>

    <div style="background: #f9fafb; border-left: 3px solid #facc15; padding: 10px 12px; font-size: 12px; color: #4b5563; border-radius: 0 6px 6px 0; margin-bottom: 24px;">
      Test credentials: <strong style="color: #111827;">Chukwunonso/ Chukwunonsopass</strong>
    </div>

    <div style="text-align: center; font-size: 12px; color: #4b5563;">
      New here? <a href="#" style="color: #111827; font-weight: bold; text-decoration: none;">Create an account</a>
    </div>
  </div>
</body>
</html>
